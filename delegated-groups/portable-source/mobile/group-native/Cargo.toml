[package]
name = "secure-group-mobile"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "secure_group_mobile"
crate-type = ["staticlib", "cdylib"]

[dependencies]
secure-group-protocol = { path = "../../rust/group-protocol" }
zeroize = "1.7"
jni = "0.21"
serde_json = "1"

[dev-dependencies]
base64 = "0.21"
serde_json = "1"
ed25519-dalek = "2.1"
securelegion = { path = "../../shared-rust/rust-core", default-features = false, features = ["std"] }
secure-device-protocol = { path = "../../rust/device-protocol" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[[test]]
name = "canonical_protocol"
path = "../../rust/group-protocol/tests/platform_api.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
