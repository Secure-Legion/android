[package]
name = "secure-group-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Portable per-device authorization for Secure's account-scoped group operations"

[dependencies]
secure-device-protocol = { path = "../device-protocol" }
securelegion = { path = "../../shared-rust/rust-core", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
sha2 = "0.10"
thiserror = "1.0"
base64 = "0.21"
hex = "0.4"
serde_json = "1"
rand = "0.8"
zeroize = "1.7"
subtle = "2.6"

[dev-dependencies]
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
