[package]
name = "secure-device-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Portable validation for Secure's independently authorized linked devices"

[dependencies]
base64 = "0.21"
data-encoding = "2"
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
