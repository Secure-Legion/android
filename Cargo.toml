[package]
name = "securelegion-crypto"
version = "1.0.0"
edition = "2021"
authors = ["Secure Legion Team"]
description = "Privacy-focused cryptography, CRDT, audio, and Tor integration library"
license = "MIT OR Apache-2.0"

[lib]
name = "securelegion_crypto"
crate-type = ["lib"]

[dependencies]
# Cryptography
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["custom"] }
sha3 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
blake3 = "1.5"
subtle = "2.5"
bulletproofs = "5.0.0"
curve25519-dalek = { version = "4", features = ["rand_core"] }
merlin = "3"

# Post-Quantum Cryptography
ml-kem = { version = "0.2", features = ["deterministic", "zeroize"] }
rand_chacha = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
serde-big-array = "0.5"
ciborium = "0.2"

# Encoding
bs58 = "0.5"
base64 = "0.21"
hex = "0.4"
base32 = "0.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"

# Time
chrono = "0.4"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Sync primitives
once_cell = "1.19"
arc-swap = "1"
lru = "0.12"

# Android-only dependencies
[target.'cfg(target_os = "android")'.dependencies]
opus = "0.3"
android_logger = "0.14"
jni = "0.21"

# Mobile-only (Android + iOS): async runtime, Tor, networking
[target.'cfg(not(target_os = "windows"))'.dependencies]
tokio = { version = "1.35", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util", "process", "io-std"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
futures = "0.3"
arti-client = { version = "0.40", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "onion-service-service",
    "experimental-api",
    "static-sqlite",
    "geoip",
] }
tor-rtcompat = { version = "0.40", features = ["tokio", "rustls"] }
tor-hsservice = "0.40"
tor-proto = { version = "0.40", features = ["stream-ctrl"] }
tor-cell = "0.40"
tor-config-path = "0.40"
tor-llcrypto = "0.40"
tor-hscrypto = "0.40"
tor-netdir = { version = "0.40", features = ["geoip", "experimental-api"] }
tor-linkspec = "0.40"
tor-dirmgr = "0.40"
tor-geoip = "0.40"

[features]
default = ["std"]
std = []
debug-logs = []
