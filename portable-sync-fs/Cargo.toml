[package]
name = "secure-sync-fs"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
exclude = ["vendor/snow"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
snow = { path = "vendor/snow", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
base64 = "0.21"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
debug = 1
