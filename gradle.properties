# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# These six flags are flagged "deprecated" by AGP 9.x but they ARE load-bearing.
# Removing them flips AGP to its new defaults — which break this codebase
# (e.g. android.builtInKotlin=false holds back AGP's auto Kotlin plugin so
# our explicit kotlin-android plugin in app/build.gradle.kts doesn't conflict).
# Migrating off these is a multi-file refactor; leave them until that work
# is scheduled. The deprecation warnings are noisy but harmless.
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Suppress the "library constraints" perf-hint sync-issue warning.
# Enabling android.dependency.excludeLibraryComponentsFromConstraints=true
# would slightly speed up project import on very large projects but can change
# how Gradle resolves transitive deps, so we suppress the nag instead.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false